      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_data:
                  type: object
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean

  /api/mpp/stream/open:
    post:
      tags: [MPP]
      operationId: mppStreamsOpen
