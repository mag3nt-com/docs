                    type: string
                  card_id:
                    type: string
                  budget:
                    type: ['number', 'string']
                  tick_amount:
                    type: ['number', 'string']
                  total_ticked:
                    type: ['number', 'string']
                  status:
                    type: string

  # ═══════════════ PAY LINKS ═══════════════
  /api/paylinks:
